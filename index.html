<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>🐟 SalmonFeeding AI</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ======== 顶部搜索栏 ======== -->
<div id="searchBar">
  <div class="search-icon">🔍</div>
  <input id="globalSearch" placeholder="搜索 投喂计算 / 水质 / 疾病 / FCR..." oninput="onSearch(this.value)" onfocus="showSearchResults()">
  <button class="search-btn" onclick="runSearch()">搜索</button>
</div>
<div id="searchResults" style="display:none"></div>
<div id="searchOverlay" onclick="hideSearchResults()"></div>

<!-- ======== 主内容区 ======== -->
<div id="app">
  <!-- 仪表盘 -->
  <div class="page active" id="page-home">
    <div class="card hero">
      <div class="hero-icon">🐟</div>
      <div class="hero-title">SalmonFeeding AI</div>
      <div class="hero-sub">智能投喂 · 数据驱动</div>
    </div>
    <div class="quick-grid">
      <button class="quick-btn" onclick="switchPage('calc');focusInput('avgWeight')">
        <span class="qb-icon">📐</span><span>投喂计算</span><small>输入参数自动算</small>
      </button>
      <button class="quick-btn" onclick="switchPage('records')">
        <span class="qb-icon">📋</span><span>投喂记录</span><small>${records.length}条记录</small>
      </button>
      <button class="quick-btn" onclick="switchPage('dashboard')">
        <span class="qb-icon">📊</span><span>数据面板</span><small>图表+预警</small>
      </button>
      <button class="quick-btn" onclick="switchPage('knowledge')">
        <span class="qb-icon">📚</span><span>知识库</span><small>12条知识源</small>
      </button>
      <button class="quick-btn" onclick="switchPage('chat')">
        <span class="qb-icon">🤖</span><span>AI助手</span><small>24h在线</small>
      </button>
      <button class="quick-btn" onclick="switchPage('settings')">
        <span class="qb-icon">⚙️</span><span>设置</span><small>参数默认值</small>
      </button>
    </div>
  </div>

  <!-- 投喂计算页 -->
  <div class="page" id="page-calc">
    <div class="card"><h3>📐 投喂计划</h3>
    <div class="param-grid">
      <button class="param-card" id="pc-fish" onclick="cycleFishType()">
        <small>鱼种</small><b id="fishLabel">三文鱼</b>
      </button>
      <button class="param-card" id="pc-weight" onclick="focusInput('avgWeight')">
        <small>平均体重</small><b><input id="avgWeight" type="number" value="150" oninput="autoCalc()" style="all:unset;width:60px;text-align:center;font-weight:700"> g</b>
      </button>
      <button class="param-card" id="pc-count" onclick="focusInput('count')">
        <small>养殖数量</small><b><input id="count" type="number" value="5000" oninput="autoCalc()" style="all:unset;width:70px;text-align:center;font-weight:700"> 尾</b>
      </button>
      <button class="param-card" id="pc-temp" onclick="focusInput('waterTemp')">
        <small>水温</small><b><input id="waterTemp" type="number" value="14" step="0.1" oninput="autoCalc()" style="all:unset;width:45px;text-align:center;font-weight:700"> ℃</b>
      </button>
      <button class="param-card" id="pc-do" onclick="focusInput('doLevel')">
        <small>溶氧</small><b><input id="doLevel" type="number" value="8.5" step="0.1" oninput="autoCalc()" style="all:unset;width:45px;text-align:center;font-weight:700"> mg/L</b>
      </button>
      <button class="param-card" id="pc-ph" onclick="focusInput('ph')">
        <small>pH</small><b><input id="ph" type="number" value="7.2" step="0.1" oninput="autoCalc()" style="all:unset;width:45px;text-align:center;font-weight:700"></b>
      </button>
      <button class="param-card" id="pc-nh3" onclick="focusInput('ammonia')">
        <small>氨氮</small><b><input id="ammonia" type="number" value="0.15" step="0.01" oninput="autoCalc()" style="all:unset;width:50px;text-align:center;font-weight:700"> mg/L</b>
      </button>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn-primary" onclick="calcFeeding()" id="calcBtn" style="flex:1;padding:14px;font-size:15px">🔍 计算</button>
      <button class="btn-outline" onclick="autoFillDemo()">📋 示例</button>
    </div>
    <div id="liveWarnings" style="margin-top:8px"></div>
    </div>
    <div id="feedingResult"></div>
  </div>

  <!-- 记录页 -->
  <div class="page" id="page-records">
    <div class="card"><h3>📋 投喂记录</h3>
    <div class="quick-add">
      <input id="recFeed" type="number" placeholder="投喂量(kg)" step="0.1" style="flex:1">
      <input id="recRate" type="number" placeholder="摄食率%" value="90" style="width:80px">
      <button class="btn-primary" onclick="addRecord()">✚</button>
    </div>
    <div id="recordList"></div>
    </div>
  </div>

  <!-- 仪表盘页 -->
  <div class="page" id="page-dashboard">
    <div class="grid-2" id="statCards"></div>
    <div class="card"><h3>📈 趋势</h3><div class="chart-box" id="chartFeed"></div></div>
    <div class="card"><h3>📊 生长</h3><div class="chart-box" id="chartGrowth"></div></div>
    <div class="card"><h3>⚡ 预警</h3><div id="warnings"></div></div>
  </div>

  <!-- 知识库页 -->
  <div class="page" id="page-knowledge">
    <div class="card"><h3>📚 知识源</h3><div id="kbList"></div></div>
  </div>

  <!-- AI 对话页 -->
  <div class="page" id="page-chat">
    <div class="card" style="flex:1;display:flex;flex-direction:column">
      <h3>🤖 AI 助手</h3>
      <div class="quick-asks">
        <button onclick="quickAsk('水温15度体重200g')">水温15℃ 200g</button>
        <button onclick="quickAsk('FCR标准')">FCR标准</button>
        <button onclick="quickAsk('密度')">密度</button>
        <button onclick="quickAsk('疾病')">疾病</button>
        <button onclick="quickAsk('pH范围')">pH范围</button>
      </div>
      <div class="chat-box" id="chatBox"><div class="chat-msg ai">👋 直接输入问题，如 "水温18度体重150g"</div></div>
      <div class="chat-input"><input id="chatInput" placeholder="输入问题..." onkeydown="if(event.key==='Enter')askAI()"><button class="btn-primary" onclick="askAI()">发送</button></div>
    </div>
  </div>

  <!-- 设置页 -->
  <div class="page" id="page-settings">
    <div class="card">
      <h3>⚙️ 默认参数</h3>
      <div class="setting-row"><span>默认鱼种</span><select id="defFish" onchange="saveSettings()"><option>三文鱼(大西洋鲑)</option><option>虹鳟</option></select></div>
      <div class="setting-row"><span>默认体重 (g)</span><input id="defWeight" type="number" value="150" onchange="saveSettings()"></div>
      <div class="setting-row"><span>默认数量</span><input id="defCount" type="number" value="5000" onchange="saveSettings()"></div>
      <div class="setting-row"><span>默认水温 (℃)</span><input id="defTemp" type="number" value="14" step="0.1" onchange="saveSettings()"></div>
      <div class="setting-row"><span>默认溶氧 (mg/L)</span><input id="defDO" type="number" value="8.5" step="0.1" onchange="saveSettings()"></div>
      <button class="btn-outline" onclick="resetSettings()" style="width:100%;margin-top:8px">恢复默认</button>
    </div>
    <div class="card"><h3>📦 数据管理</h3>
    <button class="btn-outline" onclick="exportData()" style="width:100%;margin-bottom:6px">📥 导出数据</button>
    <button class="btn-outline" onclick="document.getElementById('importFile').click()" style="width:100%">📤 导入数据</button>
    <input type="file" id="importFile" accept=".json" onchange="importData(this)" style="display:none">
    </div>
  </div>
</div>

<!-- ======== 底部导航 ======== -->
<div id="bottomNav">
  <button onclick="switchPage('home')" class="nav-btn active" data-page="home">
    <span class="nav-icon">🏠</span><span class="nav-label">首页</span>
  </button>
  <button onclick="switchPage('calc')" class="nav-btn" data-page="calc">
    <span class="nav-icon">📐</span><span class="nav-label">计算</span>
  </button>
  <button onclick="switchPage('records')" class="nav-btn" data-page="records">
    <span class="nav-icon">📋</span><span class="nav-label">记录</span>
  </button>
  <button onclick="switchPage('dashboard')" class="nav-btn" data-page="dashboard">
    <span class="nav-icon">📊</span><span class="nav-label">数据</span>
  </button>
  <button onclick="switchPage('chat')" class="nav-btn" data-page="chat">
    <span class="nav-icon">🤖</span><span class="nav-label">AI</span>
  </button>
</div>

<!-- 隐藏输入 -->
<input id="fishType" type="hidden" value="三文鱼(大西洋鲑)">

<script src="js/knowledge.js"></script>
<script src="js/feeding.js"></script>
<script src="js/app.js"></script>
</body>
</html>
